name: Docker images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Exposes the Actions cache credentials to the build script, which keeps the image layers between runs.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build both images and validate Compose
        run: bash deploy/build-images.sh

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Exposes the Actions cache credentials to the build script, which keeps the image layers between runs.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build release images
        run: bash deploy/build-images.sh
      - name: Publish matching SHA tags to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHCR occasionally refuses a request for a moment ("denied"); retry before failing the release.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" -eq 3 ] && return 1
              echo "Attempt $attempt failed: $*; retrying" >&2
              sleep $((attempt * 15))
            done
          }
          retry sh -c 'printf "%s" "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin'
          retry docker push "ghcr.io/line4-idea2ip/idea2ip-rag:$GITHUB_SHA"
          retry docker push "ghcr.io/line4-idea2ip/idea2ip-be:$GITHUB_SHA"
