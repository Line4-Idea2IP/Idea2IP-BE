spring.application.name=idea2ip
spring.config.import=optional:file:./src/main/resources/application-secret.properties

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
idea2ip.project-thumbnail-dir=${PROJECT_THUMBNAIL_DIR:uploads/project-thumbnails}
idea2ip.material-image-dir=${MATERIAL_IMAGE_DIR:uploads/material-images}

jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION}
