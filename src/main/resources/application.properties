spring.application.name=idea2ip
spring.config.import=optional:file:./src/main/resources/application-secret.properties

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
idea2ip.project-thumbnail-dir=${PROJECT_THUMBNAIL_DIR:uploads/project-thumbnails}
idea2ip.material-image-dir=${MATERIAL_IMAGE_DIR:uploads/material-images}
idea2ip.artwork-image-dir=${ARTWORK_IMAGE_DIR:uploads/artwork-images}

spring.task.scheduling.pool.size=2
idea2ip.interview.question-mode=${INTERVIEW_QUESTION_MODE:mock}
idea2ip.interview.llm-base-url=${IDEA2IP_LLM_BASE_URL:http://127.0.0.1:8081/v1}
idea2ip.interview.llm-model=${IDEA2IP_LLM_MODEL:idea2ip-vl}
idea2ip.brief.ai-mode=${BRIEF_AI_MODE:mock}
idea2ip.brief.ai-base-url=${BRIEF_AI_BASE_URL:http://127.0.0.1:8000}
idea2ip.brief.ai-token=${BRIEF_AI_TOKEN:}
idea2ip.brief.pdf-font=${BRIEF_PDF_FONT:}
idea2ip.brief.pdf-dir=${BRIEF_PDF_DIR:private/report-pdfs}

idea2ip.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://idea2ip.netlify.app}

jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION}
